# Temporary: requests the public production address from GitHub's servers and prints what comes back.
name: Probe Vercel preview

on:
  deployment_status:

permissions:
  contents: read

jobs:
  probe:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Exercise the live site
        env:
          BASE: https://turkishtowel.vercel.app
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          echo "triggered by $ENVIRONMENT deployment of $SHA"
          get() {
            code=$(curl -sS -m 30 -o body.txt -D headers.txt -w '%{http_code}' "$BASE$1" || echo "curl failed")
            echo "GET $1 returned $code $(grep -i '^content-type:' headers.txt | tr -d '\r')"
          }
          for path in / /collection /product/hammam-classic /product/sultan-stripe /product/aegean-waffle /product/fine-hammam-set /cart /product/does-not-exist /order-confirmed /css/main.css /js/cart.js /js/product.js /js/site.js; do
            get "$path"
          done
          echo
          echo "collection cards: $(curl -sS -m 30 "$BASE/collection" | grep -c 'class="card"')"
          echo "canonical: $(curl -sS -m 30 "$BASE/" | grep -o 'canonical" href="[^"]*"')"
          echo "product colours on hammam-classic: $(curl -sS -m 30 "$BASE/product/hammam-classic" | grep -c 'name="colour"')"
          post() {
            echo "POST $1 $2"
            curl -sS -m 30 -X POST "$BASE$1" -H 'content-type: application/json' -H 'accept: application/json' -d "$2" -w '\n  status %{http_code}\n'
          }
          post /newsletter '{"email":"probe@example.com"}'
          post /newsletter '{"email":"not an email"}'
          post /checkout '{"items":[]}'
          post /checkout '{"items":[{"id":"no-such-towel","quantity":1}]}'
          post /checkout '{bad json'
          post /webhook '{}'
