name: live-check
on:
  push:
    branches: [claude/pamuq-ecommerce-store-9f0ptu]
    paths: [.github/workflows/live-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the new deployment
        run: |
          for i in $(seq 1 40); do
            body=$(curl -s -X POST -H 'accept: application/json' -H 'content-type: application/json' -d '{"product":"ege-bath-towel","rating":5,"body":"Deploy check, please ignore.","name":"Check","email":"check@example.com"}' https://turkishtowel.vercel.app/reviews)
            echo "attempt $i: $body"
            case "$body" in *"could not send your review"*) exit 0;; esac
            sleep 15
          done
          exit 1
      - name: Pages
        run: |
          for path in / /shop /sets /product/ege-bath-towel /product/the-full-bathroom-set /cart /contact /faq /api/cart?ids=ege-bath-towel-salt /sitemap.xml /feeds/google.xml /nope; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' "https://turkishtowel.vercel.app$path") $path"
          done
          curl -s "https://turkishtowel.vercel.app/api/cart?ids=ege-bath-towel-salt"; echo
          curl -s -X POST -H 'accept: application/json' -H 'content-type: application/json' -d '{"email":"deploy-check@example.com","source":"footer"}' https://turkishtowel.vercel.app/newsletter; echo
