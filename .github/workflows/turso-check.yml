name: turso-check
on:
  push:
    branches: [claude/pamuq-ecommerce-store-9f0ptu]
    paths: [.github/workflows/turso-check.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports:
          - 8080:8080
    env:
      TURSO_DATABASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Wait for the libSQL server
        run: |
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8080/health && exit 0; sleep 1; done; exit 1
      - name: Tests against libSQL
        run: npm test
      - name: Data survives a restart
        run: |
          node -e "const db=require('./db');(async()=>{console.log('first sign up is new:', await db.addSubscriber('persist@example.com'));db.close()})()"
          node -e "const db=require('./db');(async()=>{const again=await db.addSubscriber('persist@example.com');console.log('second process sees it is new:', again);db.close();if(again)process.exit(1)})()"
      - name: The site runs on libSQL
        run: |
          PORT=3999 node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:3999/robots.txt && break; sleep 1; done
          for path in / /shop /product/ege-bath-towel /api/cart?ids=ege-bath-towel-salt /feeds/google.xml; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3999$path") $path"
          done
          curl -s "http://127.0.0.1:3999/api/cart?ids=ege-bath-towel-salt"; echo
          curl -s -X POST -H 'accept: application/json' -H 'content-type: application/json' -d '{"email":"reader@example.com","source":"footer"}' http://127.0.0.1:3999/newsletter; echo
          curl -s -X POST -H 'accept: application/json' -H 'content-type: application/json' -d '{"product":"ege-bath-towel","rating":4,"body":"Soft.","name":"Lee","email":"lee@example.com"}' http://127.0.0.1:3999/reviews; echo
          node -e "const db=require('./db');(async()=>{console.log('newsletter row new again?', await db.addSubscriber('reader@example.com'));db.close()})()"
          cat server.log
