<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#f5f0e8">
  <meta name="color-scheme" content="light">
  {{{robots}}}
  <link rel="canonical" href="{{canonicalUrl}}">

  <meta property="og:site_name" content="Pamuq">
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonicalUrl}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f5f0e8'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='21' fill='%231d1b17'%3EP%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Inter:wght@300;400&amp;display=swap">
  <link rel="stylesheet" href="/css/main.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body class="page-{{page}}" data-page="{{page}}" data-free-delivery="{{freeDeliveryPence}}">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-site-header>
    <div class="site-header__inner">
      <a class="wordmark" href="/" aria-label="Pamuq, home">PAMUQ</a>

      <nav class="site-nav" aria-label="Primary">
        <a href="/shop"{{{navShop}}}>Shop</a>
        <a href="/sets"{{{navSets}}}>Sets</a>
        <a href="/#aegean-cotton">Aegean Cotton</a>
      </nav>

      <a class="cart-link" href="/cart" data-cart-toggle aria-label="Bag, 0 items">
        <!-- Tabler Icons "shopping-bag" (MIT), inlined so the page needs no icon font. -->
        <svg class="ti ti-shopping-bag" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M6.331 8h11.339a2 2 0 0 1 1.977 2.304l-1.255 8.152a3 3 0 0 1 -2.966 2.544h-6.852a3 3 0 0 1 -2.965 -2.544l-1.255 -8.152a2 2 0 0 1 1.977 -2.304z"/>
          <path d="M9 11v-5a3 3 0 0 1 6 0v5"/>
        </svg>
        <span class="cart-count" data-cart-count hidden>0</span>
      </a>
    </div>
  </header>

  <main id="main" tabindex="-1">
