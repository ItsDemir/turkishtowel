  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="site-footer__grid">
        <nav aria-labelledby="footer-brand">
          <h2 class="site-footer__title" id="footer-brand">Pamuq</h2>
          <ul class="site-footer__list">
            <li><a href="/collection">Collection</a></li>
            <li><a href="/#craft">Craft</a></li>
            <li><a href="/#about">About</a></li>
          </ul>
        </nav>

        <nav aria-labelledby="footer-care">
          <h2 class="site-footer__title" id="footer-care">Customer care</h2>
          <ul class="site-footer__list">
            <li><a href="/cart">Your bag</a></li>
            <li><a href="/cart#delivery">Delivery and returns</a></li>
            <li><a href="/product/hammam-classic#care">Care guide</a></li>
          </ul>
        </nav>

        <div id="newsletter">
          <form class="newsletter" data-newsletter novalidate>
            <label class="newsletter__label" for="newsletter-email">Letters from the loom, a few times a year.</label>
            <div class="newsletter__field">
              <input id="newsletter-email" name="email" type="email" autocomplete="email" placeholder="Email address" required>
              <button type="submit">Subscribe</button>
            </div>
            <p class="newsletter__status" role="status" data-newsletter-status></p>
          </form>
        </div>
      </div>

      <div class="site-footer__bottom">
        <p>&copy; {{year}} Pamuq</p>
        <p>Made with care in Turkey</p>
      </div>
    </div>
  </footer>

  <p class="visually-hidden" role="status" aria-live="polite" data-cart-live></p>

  <div class="drawer-backdrop" data-drawer-backdrop></div>
  <aside class="drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true" tabindex="-1" data-drawer data-cart-view="drawer">
    <div class="drawer__head">
      <h2 class="drawer__title" id="drawer-title">Your bag</h2>
      <button class="drawer__close" type="button" data-drawer-close aria-label="Close bag">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M18 6l-12 12"/>
          <path d="M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="drawer__body">
      <ul class="lines lines--compact" data-cart-items></ul>
      <div class="empty empty--compact" data-cart-empty hidden>
        <p class="empty__title">Your bag is empty.</p>
        <a class="text-link" href="/collection">Browse the collection</a>
      </div>
    </div>

    <div class="drawer__foot" data-cart-filled hidden>
      <p class="summary-line"><span>Subtotal</span><span data-subtotal>£0</span></p>
      <p class="delivery-note" data-delivery-note></p>
      <button class="btn btn--solid" type="button" data-checkout>Proceed to checkout</button>
      <p class="form-message" role="alert" data-checkout-message></p>
      <a class="text-link drawer__view" href="/cart">View bag</a>
    </div>
  </aside>

  <script src="/js/cart.js" defer></script>
  <script src="/js/site.js" defer></script>
  {{{scripts}}}
</body>
</html>
